<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Sin esto el navegador guarda el catalogo y el cliente puede quedarse
     viendo precios de ayer, con el dolar viejo. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Catálogo mayorista</title>
<style>
  :root{
    --fondo:#f4f5f7; --panel:#fff; --texto:#17181a; --suave:#6b7280;
    --linea:#e3e6ea;
    --marca:#F1612A;          /* naranja de la M del logo BOOM */
    --acento:#D94F1E;         /* naranja mas oscuro, para que el texto blanco se lea */
    --cabecera:#101010;       /* negro del logo */
    --cab-linea:#2c2c2c;
    --cab-texto:#f5f5f5;
    --cab-suave:#9aa0a6;
    --sombra:0 1px 3px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  /* Cuando algo se marca como oculto, tiene que quedar oculto SIEMPRE.
     Sin esto, cualquier regla que fije un display (por ejemplo el boton de
     enviar, que es flex) le gana y el elemento se ve igual. */
  [hidden]{display:none !important}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background:var(--fondo);color:var(--texto);padding-bottom:88px}

  header{position:sticky;top:0;z-index:20;background:var(--cabecera);
         border-top:3px solid var(--marca);
         border-bottom:1px solid var(--cab-linea);box-shadow:0 2px 10px rgba(0,0,0,.18)}
  .cabecera{max-width:1200px;margin:0 auto;padding:12px 16px;
            display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .identidad{display:flex;align-items:center;gap:12px}
  .identidad img{height:42px;width:auto;display:block;border-radius:4px}
  .marca{font-size:16px;font-weight:800;margin:0;letter-spacing:.2px;line-height:1.15;
         color:var(--cab-texto);text-transform:uppercase}
  .cotiz{font-size:12px;color:var(--cab-suave);margin-top:3px}
  .buscador{flex:1;min-width:220px;display:flex;gap:8px}
  .buscador input{flex:1;padding:10px 12px;border:1px solid var(--cab-linea);
                  border-radius:8px;font-size:15px;background:#1b1b1b;color:var(--cab-texto)}
  .buscador input::placeholder{color:#7d838a}
  .buscador input:focus{outline:2px solid var(--marca);border-color:transparent}

  .rubros{max-width:1200px;margin:0 auto;padding:0 16px 12px;
          display:flex;gap:8px;overflow-x:auto}
  .rubros button{white-space:nowrap;padding:7px 14px;border:1px solid var(--cab-linea);
                 background:#1b1b1b;border-radius:999px;font-size:13px;cursor:pointer;color:#c9ced4}
  .rubros button:hover{border-color:var(--marca);color:var(--cab-texto)}
  .rubros button.activo{background:var(--marca);border-color:var(--marca);color:#101010;font-weight:700}

  .barra-orden{max-width:1200px;margin:0 auto;padding:14px 16px 0;
               display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .conteo{font-size:13px;color:var(--suave)}
  .orden{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--suave)}
  .orden select{padding:7px 10px;border:1px solid var(--linea);border-radius:8px;
                font-size:13px;font-family:inherit;background:var(--panel);color:var(--texto);cursor:pointer}
  .orden select:focus{outline:2px solid var(--marca);border-color:transparent}

  .grilla{max-width:1200px;margin:0 auto;padding:12px 16px;
          display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}

  .ficha{background:var(--panel);border:1px solid var(--linea);border-radius:12px;
         overflow:hidden;display:flex;flex-direction:column}
  .foto{aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;padding:10px}
  .foto img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
  /* Productos todavia sin foto: cartel prolijo en vez del icono roto */
  .foto.sin-foto{background:#fafbfc}
  .foto.sin-foto::after{content:"sin foto";color:#b6bcc4;font-size:12px;letter-spacing:.5px}

  /* visor de fotos: al tocar una foto se abre en grande */
  .visor{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;
         display:none;align-items:center;justify-content:center;
         flex-direction:column;gap:16px;padding:24px}
  .visor.abierto{display:flex}
  .visor img{max-width:min(94vw,760px);max-height:70vh;object-fit:contain;
             background:#fff;border-radius:10px;padding:12px}
  .visor-info{text-align:center;max-width:94vw}
  .visor-info h3{margin:0 0 5px;font-size:16px;color:#f5f5f5;font-weight:600}
  .visor-info .ref{font-size:12px;color:#9aa0a6;letter-spacing:.3px}
  .visor-info .precio{color:var(--marca);font-size:22px;font-weight:700;margin-top:8px}
  .visor-info .precio small{display:block;font-size:13px;color:#9aa0a6;font-weight:400;margin-top:2px}
  .visor-cerrar{position:absolute;top:12px;right:18px;background:none;border:none;
                color:#fff;font-size:36px;cursor:pointer;line-height:1;padding:4px 10px}
  .cuerpo{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .titulo{font-size:13px;font-weight:600;line-height:1.35;margin:0;
          display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .codigo{font-size:11px;color:var(--suave);letter-spacing:.3px}
  .precios{margin-top:auto;padding-top:6px}
  .pesos{font-size:18px;font-weight:700;color:var(--acento)}
  .dolares{font-size:12px;color:var(--suave)}

  .sumar{display:flex;align-items:center;gap:8px;margin-top:8px}
  .sumar button{width:32px;height:32px;border:1px solid var(--linea);background:#fff;
                border-radius:8px;font-size:17px;cursor:pointer;line-height:1}
  .sumar input{width:52px;height:32px;text-align:center;border:1px solid var(--linea);
               border-radius:8px;font-size:14px}
  .sumar .agregar{flex:1;width:auto;background:var(--acento);color:#fff;border-color:var(--acento);
                  font-size:12px;font-weight:600;letter-spacing:.3px}

  .vacio{max-width:1200px;margin:40px auto;padding:0 16px;text-align:center;color:var(--suave)}

  .barra{position:fixed;bottom:0;left:0;right:0;background:var(--panel);
         border-top:1px solid var(--linea);box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:30}
  .barra-int{max-width:1200px;margin:0 auto;padding:12px 16px;
             display:flex;align-items:center;justify-content:space-between;gap:12px}
  .resumen{font-size:13px;color:var(--suave)}
  .resumen b{display:block;font-size:20px;color:var(--texto)}
  .barra .ver{padding:12px 22px;background:var(--acento);color:#fff;border:none;
              border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
  .barra .ver:disabled{background:#cbd5e1;cursor:default}

  dialog{border:none;border-radius:14px;padding:0;max-width:620px;width:94%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .modal-cab{padding:16px 20px;border-bottom:1px solid var(--linea);
             display:flex;justify-content:space-between;align-items:center}
  .modal-cab h2{margin:0;font-size:17px}
  .cerrar{border:none;background:none;font-size:24px;cursor:pointer;color:var(--suave);line-height:1}
  .modal-cuerpo{padding:8px 20px;max-height:52vh;overflow:auto}
  .reng{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea);font-size:14px}
  .reng .quitar{border:none;background:none;color:#b91c1c;cursor:pointer;font-size:12px}
  .modal-pie{padding:16px 20px;border-top:1px solid var(--linea)}
  .total{display:flex;justify-content:space-between;font-size:17px;font-weight:700;margin-bottom:12px}
  .aviso{font-size:12px;color:var(--suave);text-align:center;margin:10px 0 0}
  .ficha-titulo{font-size:13px;font-weight:600;margin:0 0 10px}
  .ficha-nota{font-size:12px;color:var(--suave);margin:0 0 12px}
  .ficha-grilla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ficha-grilla .campo.ancho{grid-column:1 / -1}
  @media (max-width:520px){ .ficha-grilla{grid-template-columns:1fr} }
  .guardar{width:100%;margin-top:12px;padding:13px;border:none;border-radius:10px;
           background:var(--acento);color:#fff;font-size:15px;font-weight:700;
           font-family:inherit;cursor:pointer}
  .guardar:hover{background:var(--marca)}
  .resumen-cliente{background:#f7f8fa;border:1px solid var(--linea);border-radius:10px;
                   padding:11px 13px;margin-bottom:12px;font-size:13px}
  .resumen-cliente b{display:block;font-size:14px;margin-bottom:2px}
  .resumen-cliente .detalle{color:var(--suave)}
  .resumen-cliente .editar{background:none;border:none;padding:0;margin-top:6px;
                           color:var(--acento);font-size:12px;cursor:pointer;
                           font-family:inherit;text-decoration:underline}
  .campo{display:block;margin-bottom:12px}
  .campo span{display:block;font-size:12px;color:var(--suave);margin-bottom:4px}
  .campo input{width:100%;padding:10px 12px;border:1px solid var(--linea);
               border-radius:8px;font-size:15px;font-family:inherit}
  .campo input:focus{outline:2px solid var(--marca);border-color:transparent}
  .enviar{width:100%;padding:14px;border:none;border-radius:10px;cursor:pointer;
          background:#25D366;color:#fff;font-size:16px;font-weight:700;font-family:inherit;
          display:flex;align-items:center;justify-content:center;gap:9px}
  .enviar:hover{background:#1eb455}
  .enviar svg{width:20px;height:20px;fill:currentColor}
  .alerta{background:#fff4e5;border:1px solid #ffd8a8;color:#8a4b00;
          padding:10px 12px;border-radius:8px;font-size:13px;margin-top:10px}
</style>
</head>

const pesos = n => "$" + n.toLocaleString("es-AR", {maximumFractionDigits: 0});
const usd   = n => "US$" + n.toFixed(2);

let rubroActivo = "todos";
let ordenActivo = "novedades";
let busqueda = "";
const carrito = new Map();

document.title = DATOS.negocio + " — Catálogo mayorista";
document.getElementById("marca").textContent = DATOS.negocio;
document.getElementById("cotiz").textContent =
  "Precios al dólar " + pesos(DATOS.dolar) + " · actualizado el " + DATOS.generado;

// --- filtros por rubro ---
const contRubros = document.getElementById("rubros");
["todos"].concat(DATOS.rubros).forEach(r => {
  const b = document.createElement("button");
  b.textContent = r.replace(/-/g, " ");
  b.dataset.rubro = r;
  if (r === "todos") b.classList.add("activo");
  b.onclick = () => {
    rubroActivo = r;
    contRubros.querySelectorAll("button").forEach(x => x.classList.remove("activo"));
    b.classList.add("activo");
    dibujar();
  };
  contRubros.appendChild(b);
});

document.getElementById("q").addEventListener("input", e => {
  busqueda = e.target.value.trim().toLowerCase();
  dibujar();
});

document.getElementById("orden").addEventListener("change", e => {
  ordenActivo = e.target.value;
  dibujar();
});

function filtrados() {
  const lista = DATOS.productos.filter(p => {
    // Un producto puede pertenecer a varios rubros a la vez
    if (rubroActivo !== "todos" && p.rubros.indexOf(rubroActivo) === -1) return false;
    if (!busqueda) return true;
    return (p.nombre + " " + p.codigo).toLowerCase().includes(busqueda);
  });

  // "orden" es la posición que tiene el producto en la página del proveedor:
  // 0 es lo último que cargó. Lo de nuestro depósito viene con -1, así que
  // queda arriba de todo.
  if (ordenActivo === "novedades")   lista.sort((a, b) => a.orden - b.orden);
  else if (ordenActivo === "baratos") lista.sort((a, b) => a.precioArs - b.precioArs);
  else if (ordenActivo === "caros")   lista.sort((a, b) => b.precioArs - a.precioArs);
  else if (ordenActivo === "nombre")  lista.sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));

  return lista;
}

function dibujar() {
  const lista = filtrados();
  const grilla = document.getElementById("grilla");
  grilla.innerHTML = "";
  document.getElementById("vacio").hidden = lista.length > 0;
  document.getElementById("conteo").textContent =
    lista.length + (lista.length === 1 ? " producto" : " productos");

  const frag = document.createDocumentFragment();
  lista.forEach(p => {
    const ficha = document.createElement("article");
    ficha.className = "ficha";
    ficha.innerHTML = `
      <div class="foto${p.imagen ? "" : " sin-foto"}">${p.imagen
        ? `<img loading="lazy" src="${p.imagen}" alt=""
             onerror="this.parentNode.classList.add('sin-foto');this.remove()">`
        : ""}</div>
      <div class="cuerpo">
        <h3 class="titulo">${p.nombre}</h3>
        <div class="codigo">${p.codigo}</div>
        <div class="precios">
          <div class="pesos">${pesos(p.precioArs)}</div>
          <div class="dolares">${usd(p.precioUsd)}</div>
        </div>
        <div class="sumar">
          <button data-menos>−</button>
          <input type="number" min="0" value="${carrito.get(p.id) || 0}">
          <button data-mas>+</button>
        </div>
      </div>`;

    const foto = ficha.querySelector(".foto img");
    if (foto) foto.onclick = () => abrirVisor(p);

    const input = ficha.querySelector("input");
    const fijar = v => {
      const n = Math.max(0, parseInt(v) || 0);
      input.value = n;
      if (n === 0) carrito.delete(p.id); else carrito.set(p.id, n);
      actualizarBarra();
    };
    ficha.querySelector("[data-menos]").onclick = () => fijar(+input.value - 1);
    ficha.querySelector("[data-mas]").onclick   = () => fijar(+input.value + 1);
    input.onchange = () => fijar(input.value);

    frag.appendChild(ficha);
  });
  grilla.appendChild(frag);
}

// --- visor de fotos -------------------------------------------------------
const visor = document.getElementById("visor");

function abrirVisor(p) {
  document.getElementById("visorImg").src = p.imagen;
  document.getElementById("visorImg").alt = p.nombre;
  document.getElementById("visorNombre").textContent = p.nombre;
  document.getElementById("visorCodigo").textContent = p.codigo;
  document.getElementById("visorPrecio").innerHTML =
    pesos(p.precioArs) + "<small>" + usd(p.precioUsd) + "</small>";
  visor.classList.add("abierto");
}

function cerrarVisor() { visor.classList.remove("abierto"); }

document.getElementById("visorCerrar").onclick = cerrarVisor;
// Tocar cualquier lado que no sea la foto también cierra
visor.onclick = e => { if (e.target.id !== "visorImg") cerrarVisor(); };
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && visor.classList.contains("abierto")) cerrarVisor();
});

function totales() {
  let unidades = 0, ars = 0, usdT = 0;
  carrito.forEach((cant, id) => {
    const p = DATOS.productos.find(x => x.id === id);
    if (!p) return;
    unidades += cant;
    ars  += p.precioArs * cant;
    usdT += p.precioUsd * cant;
  });
  return {unidades, ars, usd: usdT};
}

function actualizarBarra() {
  const t = totales();
  document.getElementById("items").textContent =
    t.unidades + (t.unidades === 1 ? " unidad" : " unidades");
  document.getElementById("totalPesos").textContent = pesos(t.ars);
  document.getElementById("verPedido").disabled = t.unidades === 0;
}

const modal = document.getElementById("modal");
document.getElementById("verPedido").onclick = () => {
  const cont = document.getElementById("renglones");
  cont.innerHTML = "";
  carrito.forEach((cant, id) => {
    const p = DATOS.productos.find(x => x.id === id);
    if (!p) return;
    const fila = document.createElement("div");
    fila.className = "reng";
    fila.innerHTML = `
      <div><b>${cant} ×</b> ${p.nombre}<br>
           <span class="codigo">${p.codigo}</span>
           <button class="quitar">quitar</button></div>
      <div>${pesos(p.precioArs * cant)}</div>`;
    fila.querySelector(".quitar").onclick = () => {
      carrito.delete(id);
      actualizarBarra(); dibujar();
      if (carrito.size === 0) modal.close(); else document.getElementById("verPedido").click();
    };
    cont.appendChild(fila);
  });
  const t = totales();
  document.getElementById("totalModal").textContent = pesos(t.ars) + "  ·  " + usd(t.usd);
  modal.showModal();
};
document.getElementById("cerrar").onclick = () => modal.close();

// --- ficha del cliente ----------------------------------------------------
// Los datos quedan guardados en el celular del cliente y, la primera vez que
// los carga, se copian al formulario de Google (la planilla de clientes).
const FORMULARIO = "1FAIpQLScBosW4MF3zbJFiXuaH3URax6DTFp_ji6l12iQhHUKlvdz-MQ";
const CAMPOS = {
  comercio: "entry.204970829",
  nombre:   "entry.1126572821",
  celular:  "entry.361386657",
  ciudad:   "entry.1283723398",
  email:    "entry.1612904828",
  cuit:     "entry.1517786561"
};

const formFicha    = document.getElementById("ficha");
const resumen      = document.getElementById("resumenCliente");
const botonEnviar  = document.getElementById("enviar");
const entradas = {
  comercio: document.getElementById("f_comercio"),
  nombre:   document.getElementById("f_nombre"),
  celular:  document.getElementById("f_celular"),
  cuit:     document.getElementById("f_cuit"),
  ciudad:   document.getElementById("f_ciudad"),
  email:    document.getElementById("f_email")
};

function leerGuardado() {
  try { return JSON.parse(localStorage.getItem("fichaBoom") || "null"); }
  catch (e) { return null; }
}

function mostrarFicha(datos) {
  if (datos) {
    document.getElementById("resComercio").textContent = datos.comercio;
    document.getElementById("resDetalle").textContent =
      [datos.nombre, datos.celular, datos.ciudad].filter(Boolean).join(" · ");
    resumen.hidden = false;
    formFicha.hidden = true;
    botonEnviar.hidden = false;
  } else {
    resumen.hidden = true;
    formFicha.hidden = false;
    botonEnviar.hidden = true;
  }
}

// Manda la ficha a la planilla. No podemos leer la respuesta de Google
// (el navegador no lo permite entre sitios distintos), así que si falla
// el cliente igual puede seguir con su pedido.
function registrarEnPlanilla(datos) {
  const cuerpo = new URLSearchParams();
  Object.keys(CAMPOS).forEach(k => cuerpo.append(CAMPOS[k], datos[k] || ""));
  fetch("https://docs.google.com/forms/d/e/" + FORMULARIO + "/formResponse",
        { method: "POST", mode: "no-cors", body: cuerpo }).catch(() => {});
}

formFicha.addEventListener("submit", e => {
  e.preventDefault();
  const datos = {};
  Object.keys(entradas).forEach(k => datos[k] = entradas[k].value.trim());
  try { localStorage.setItem("fichaBoom", JSON.stringify(datos)); } catch (e) {}
  registrarEnPlanilla(datos);
  mostrarFicha(datos);
});

document.getElementById("editarFicha").onclick = () => {
  const datos = leerGuardado();
  if (datos) Object.keys(entradas).forEach(k => entradas[k].value = datos[k] || "");
  mostrarFicha(null);
};

mostrarFicha(leerGuardado());

// --- envío del pedido por WhatsApp ---------------------------------------
function textoPedido() {
  const t = totales();
  const f = leerGuardado() || {};
  const lineas = ["*PEDIDO — " + DATOS.negocio + "*"];

  if (f.comercio) lineas.push("*" + f.comercio + "*");
  if (f.nombre)   lineas.push(f.nombre + (f.celular ? " · " + f.celular : ""));
  if (f.ciudad)   lineas.push(f.ciudad);
  if (f.cuit)     lineas.push("CUIT/DNI: " + f.cuit);
  if (f.email)    lineas.push(f.email);
  lineas.push("");

  carrito.forEach((cant, id) => {
    const p = DATOS.productos.find(x => x.id === id);
    if (!p) return;
    lineas.push(cant + " x " + p.nombre + " [" + p.codigo + "] — " + pesos(p.precioArs * cant));
  });

  lineas.push("");
  lineas.push("*TOTAL: " + pesos(t.ars) + "*  (" + usd(t.usd) + ")");
  lineas.push(t.unidades + (t.unidades === 1 ? " unidad" : " unidades") +
              " · precios al dólar " + pesos(DATOS.dolar));
  return lineas.join("\n");
}

botonEnviar.onclick = () => {
  if (carrito.size === 0) return;

  // Doble seguro: sin ficha completa no sale ningun pedido, aunque el boton
  // llegue a verse por algun motivo.
  const guardado = leerGuardado();
  const faltan = !guardado || Object.keys(entradas).some(k => !guardado[k]);
  if (faltan) {
    mostrarFicha(null);
    formFicha.scrollIntoView({ behavior: "smooth", block: "nearest" });
    return;
  }

  const texto = textoPedido();
  const url = "https://wa.me/" + DATOS.whatsapp + "?text=" + encodeURIComponent(texto);

  // WhatsApp corta los mensajes muy largos que llegan por link
  if (url.length > 7000) {
    let aviso = document.getElementById("avisoLargo");
    if (!aviso) {
      aviso = document.createElement("p");
      aviso.id = "avisoLargo";
      aviso.className = "alerta";
      document.querySelector(".modal-pie").appendChild(aviso);
    }
    aviso.textContent = "El pedido es muy largo para mandarlo de una. " +
      "Mandá una parte, y después volvé y cargá el resto.";
    return;
  }

  window.open(url, "_blank");
};

dibujar();
actualizarBarra();

// --- ¿hay una versión más nueva? -----------------------------------------
// El navegador guarda el catálogo para no bajarlo de nuevo, y el cliente
// puede quedarse mirando precios viejos. Consultamos un archivito de 20
// bytes: si la fecha no coincide con la que tenemos cargada, recargamos.
(function controlarVersion() {
  fetch("version.txt", { cache: "no-store" })
    .then(r => r.ok ? r.text() : null)
    .then(v => {
      if (!v) return;
      if (v.trim() !== DATOS.generado && !sessionStorage.getItem("recargado")) {
        sessionStorage.setItem("recargado", "1");   // una sola vez, sin bucles
        location.reload();
      }
    })
    .catch(() => {});   // sin internet o abierto como archivo: no molestamos
})();
</script>
